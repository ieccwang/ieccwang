<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>學術投稿與研討會管理系統</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // 主要應用組件
        function App() {
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [isFirstTime, setIsFirstTime] = useState(false);
            const [activeTab, setActiveTab] = useState('papers');
            const [papers, setPapers] = useState([]);
            const [conferences, setConferences] = useState([]);
            const [showPaperModal, setShowPaperModal] = useState(false);
            const [showSubmissionModal, setShowSubmissionModal] = useState(false);
            const [showConferenceModal, setShowConferenceModal] = useState(false);
            const [editingPaper, setEditingPaper] = useState(null);
            const [editingConference, setEditingConference] = useState(null);
            const [selectedPaperId, setSelectedPaperId] = useState(null);

            // 檢查是否為首次使用
            useEffect(() => {
                const credentials = localStorage.getItem('userCredentials');
                if (!credentials) {
                    setIsFirstTime(true);
                }
                // 檢查登入狀態
                const loginStatus = sessionStorage.getItem('isLoggedIn');
                if (loginStatus === 'true') {
                    setIsLoggedIn(true);
                }
            }, []);

            // 處理首次設定
            const handleFirstTimeSetup = (username, password) => {
                const credentials = btoa(`${username}:${password}`); // 簡單編碼
                localStorage.setItem('userCredentials', credentials);
                setIsFirstTime(false);
                setIsLoggedIn(true);
                sessionStorage.setItem('isLoggedIn', 'true');
            };

            // 處理登入
            const handleLogin = (username, password) => {
                const storedCredentials = localStorage.getItem('userCredentials');
                const inputCredentials = btoa(`${username}:${password}`);
                
                if (storedCredentials === inputCredentials) {
                    setIsLoggedIn(true);
                    sessionStorage.setItem('isLoggedIn', 'true');
                    return true;
                }
                return false;
            };

            // 處理登出
            const handleLogout = () => {
                sessionStorage.removeItem('isLoggedIn');
                setIsLoggedIn(false);
            };

            // 如果是首次使用，顯示設定頁面
            if (isFirstTime) {
                return <FirstTimeSetup onSetup={handleFirstTimeSetup} />;
            }

            // 如果未登入，顯示登入頁面
            if (!isLoggedIn) {
                return <LoginPage onLogin={handleLogin} />;
            }

            // 從 localStorage 載入資料
            useEffect(() => {
                const savedPapers = localStorage.getItem('academicPapers');
                const savedConferences = localStorage.getItem('academicConferences');
                if (savedPapers) setPapers(JSON.parse(savedPapers));
                if (savedConferences) setConferences(JSON.parse(savedConferences));
            }, []);

            // 儲存資料到 localStorage
            useEffect(() => {
                localStorage.setItem('academicPapers', JSON.stringify(papers));
            }, [papers]);

            useEffect(() => {
                localStorage.setItem('academicConferences', JSON.stringify(conferences));
            }, [conferences]);

            // 新增文章
            const addPaper = (paperData) => {
                const newPaper = {
                    id: Date.now(),
                    ...paperData,
                    submissions: [],
                    createdAt: new Date().toISOString()
                };
                setPapers([...papers, newPaper]);
                setShowPaperModal(false);
            };

            // 編輯文章
            const updatePaper = (paperId, paperData) => {
                setPapers(papers.map(p => 
                    p.id === paperId ? { ...p, ...paperData } : p
                ));
                setEditingPaper(null);
                setShowPaperModal(false);
            };

            // 刪除文章
            const deletePaper = (paperId) => {
                if (confirm('確定要刪除這篇文章嗎？')) {
                    setPapers(papers.filter(p => p.id !== paperId));
                }
            };

            // 新增投稿記錄
            const addSubmission = (paperId, submissionData) => {
                setPapers(papers.map(p => {
                    if (p.id === paperId) {
                        return {
                            ...p,
                            submissions: [...p.submissions, {
                                id: Date.now(),
                                ...submissionData,
                                submittedAt: new Date().toISOString()
                            }]
                        };
                    }
                    return p;
                }));
                setShowSubmissionModal(false);
                setSelectedPaperId(null);
            };

            // 更新投稿記錄
            const updateSubmission = (paperId, submissionId, submissionData) => {
                setPapers(papers.map(p => {
                    if (p.id === paperId) {
                        return {
                            ...p,
                            submissions: p.submissions.map(s =>
                                s.id === submissionId ? { ...s, ...submissionData } : s
                            )
                        };
                    }
                    return p;
                }));
            };

            // 刪除投稿記錄
            const deleteSubmission = (paperId, submissionId) => {
                if (confirm('確定要刪除這筆投稿記錄嗎？')) {
                    setPapers(papers.map(p => {
                        if (p.id === paperId) {
                            return {
                                ...p,
                                submissions: p.submissions.filter(s => s.id !== submissionId)
                            };
                        }
                        return p;
                    }));
                }
            };

            // 新增研討會
            const addConference = (conferenceData) => {
                const newConference = {
                    id: Date.now(),
                    ...conferenceData,
                    createdAt: new Date().toISOString()
                };
                setConferences([...conferences, newConference]);
                setShowConferenceModal(false);
            };

            // 編輯研討會
            const updateConference = (conferenceId, conferenceData) => {
                setConferences(conferences.map(c =>
                    c.id === conferenceId ? { ...c, ...conferenceData } : c
                ));
                setEditingConference(null);
                setShowConferenceModal(false);
            };

            // 刪除研討會
            const deleteConference = (conferenceId) => {
                if (confirm('確定要刪除這個研討會嗎？')) {
                    setConferences(conferences.filter(c => c.id !== conferenceId));
                }
            };

            // 匯出為 Excel
            const exportToExcel = () => {
                const wb = XLSX.utils.book_new();

                // 匯出文章投稿資料
                const paperData = [];
                papers.forEach(paper => {
                    if (paper.submissions.length === 0) {
                        paperData.push({
                            '文章標題': paper.title,
                            '作者': paper.authors || '',
                            '投稿期刊': '',
                            '投稿日期': '',
                            '狀態': '尚未投稿',
                            '備註': paper.notes || ''
                        });
                    } else {
                        paper.submissions.forEach((submission, index) => {
                            paperData.push({
                                '文章標題': index === 0 ? paper.title : '',
                                '作者': index === 0 ? paper.authors || '' : '',
                                '投稿期刊': submission.journal,
                                '投稿日期': new Date(submission.submissionDate).toLocaleDateString('zh-TW'),
                                '狀態': submission.status,
                                '備註': submission.notes || ''
                            });
                        });
                    }
                });
                const wsP = XLSX.utils.json_to_sheet(paperData);
                XLSX.utils.book_append_sheet(wb, wsP, "文章投稿");

                // 匯出研討會資料
                const conferenceData = conferences.map(conf => ({
                    '研討會名稱': conf.name,
                    '日期': new Date(conf.date).toLocaleDateString('zh-TW'),
                    '地點': conf.location,
                    '截止日期': conf.deadline ? new Date(conf.deadline).toLocaleDateString('zh-TW') : '',
                    '提交狀態': conf.submissionStatus,
                    '論文標題': conf.paperTitle || '',
                    '備註': conf.notes || ''
                }));
                const wsC = XLSX.utils.json_to_sheet(conferenceData);
                XLSX.utils.book_append_sheet(wb, wsC, "研討會");

                // 下載檔案
                XLSX.writeFile(wb, `學術追蹤_${new Date().toISOString().split('T')[0]}.xlsx`);
            };

            return (
                <div className="min-h-screen bg-gray-50">
                    {/* 標題列 */}
                    <div className="bg-blue-600 text-white p-4 shadow-lg">
                        <div className="container mx-auto flex justify-between items-center">
                            <h1 className="text-2xl font-bold">學術投稿與研討會管理系統</h1>
                            <div className="flex gap-3">
                                <button
                                    onClick={exportToExcel}
                                    className="bg-green-500 hover:bg-green-600 px-4 py-2 rounded-lg font-medium transition-colors"
                                >
                                    📊 匯出 Excel
                                </button>
                                <button
                                    onClick={handleLogout}
                                    className="bg-red-500 hover:bg-red-600 px-4 py-2 rounded-lg font-medium transition-colors"
                                >
                                    🚪 登出
                                </button>
                            </div>
                        </div>
                    </div>

                    {/* 分頁導航 */}
                    <div className="bg-white shadow-md">
                        <div className="container mx-auto">
                            <div className="flex space-x-1">
                                <button
                                    onClick={() => setActiveTab('papers')}
                                    className={`px-6 py-3 font-medium transition-colors ${
                                        activeTab === 'papers'
                                            ? 'bg-blue-50 text-blue-600 border-b-2 border-blue-600'
                                            : 'text-gray-600 hover:bg-gray-50'
                                    }`}
                                >
                                    📝 文章投稿管理
                                </button>
                                <button
                                    onClick={() => setActiveTab('conferences')}
                                    className={`px-6 py-3 font-medium transition-colors ${
                                        activeTab === 'conferences'
                                            ? 'bg-blue-50 text-blue-600 border-b-2 border-blue-600'
                                            : 'text-gray-600 hover:bg-gray-50'
                                    }`}
                                >
                                    🎤 研討會管理
                                </button>
                            </div>
                        </div>
                    </div>

                    {/* 主要內容區 */}
                    <div className="container mx-auto p-4">
                        {activeTab === 'papers' ? (
                            <PapersTab
                                papers={papers}
                                onAddPaper={() => { setEditingPaper(null); setShowPaperModal(true); }}
                                onEditPaper={(paper) => { setEditingPaper(paper); setShowPaperModal(true); }}
                                onDeletePaper={deletePaper}
                                onAddSubmission={(paperId) => { setSelectedPaperId(paperId); setShowSubmissionModal(true); }}
                                onUpdateSubmission={updateSubmission}
                                onDeleteSubmission={deleteSubmission}
                            />
                        ) : (
                            <ConferencesTab
                                conferences={conferences}
                                onAddConference={() => { setEditingConference(null); setShowConferenceModal(true); }}
                                onEditConference={(conference) => { setEditingConference(conference); setShowConferenceModal(true); }}
                                onDeleteConference={deleteConference}
                            />
                        )}
                    </div>

                    {/* 彈出視窗 */}
                    {showPaperModal && (
                        <PaperModal
                            paper={editingPaper}
                            onSave={editingPaper ? (data) => updatePaper(editingPaper.id, data) : addPaper}
                            onClose={() => { setShowPaperModal(false); setEditingPaper(null); }}
                        />
                    )}

                    {showSubmissionModal && (
                        <SubmissionModal
                            onSave={(data) => addSubmission(selectedPaperId, data)}
                            onClose={() => { setShowSubmissionModal(false); setSelectedPaperId(null); }}
                        />
                    )}

                    {showConferenceModal && (
                        <ConferenceModal
                            conference={editingConference}
                            onSave={editingConference ? (data) => updateConference(editingConference.id, data) : addConference}
                            onClose={() => { setShowConferenceModal(false); setEditingConference(null); }}
                        />
                    )}
                </div>
            );
        }

        // 文章管理分頁
        function PapersTab({ papers, onAddPaper, onEditPaper, onDeletePaper, onAddSubmission, onUpdateSubmission, onDeleteSubmission }) {
            return (
                <div>
                    <div className="mb-4 flex justify-between items-center">
                        <h2 className="text-xl font-bold text-gray-800">文章列表</h2>
                        <button
                            onClick={onAddPaper}
                            className="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-medium transition-colors"
                        >
                            ➕ 新增文章
                        </button>
                    </div>

                    {papers.length === 0 ? (
                        <div className="bg-white rounded-lg shadow p-8 text-center text-gray-500">
                            尚無文章記錄，請點擊上方按鈕新增
                        </div>
                    ) : (
                        <div className="space-y-4">
                            {papers.map(paper => (
                                <PaperCard
                                    key={paper.id}
                                    paper={paper}
                                    onEdit={() => onEditPaper(paper)}
                                    onDelete={() => onDeletePaper(paper.id)}
                                    onAddSubmission={() => onAddSubmission(paper.id)}
                                    onUpdateSubmission={(submissionId, data) => onUpdateSubmission(paper.id, submissionId, data)}
                                    onDeleteSubmission={(submissionId) => onDeleteSubmission(paper.id, submissionId)}
                                />
                            ))}
                        </div>
                    )}
                </div>
            );
        }

        // 文章卡片組件
        function PaperCard({ paper, onEdit, onDelete, onAddSubmission, onUpdateSubmission, onDeleteSubmission }) {
            const [expanded, setExpanded] = useState(true);

            const getStatusColor = (status) => {
                const colors = {
                    '已接受': 'bg-green-100 text-green-800',
                    '審查中': 'bg-yellow-100 text-yellow-800',
                    '已拒絕': 'bg-red-100 text-red-800',
                    '修改後重審': 'bg-blue-100 text-blue-800',
                    '已撤回': 'bg-gray-100 text-gray-800'
                };
                return colors[status] || 'bg-gray-100 text-gray-800';
            };

            return (
                <div className="bg-white rounded-lg shadow-md overflow-hidden">
                    <div className="p-4 bg-gradient-to-r from-blue-50 to-indigo-50">
                        <div className="flex justify-between items-start">
                            <div className="flex-1">
                                <h3 className="text-lg font-bold text-gray-800 mb-1">{paper.title}</h3>
                                {paper.authors && (
                                    <p className="text-sm text-gray-600">作者：{paper.authors}</p>
                                )}
                                {paper.notes && (
                                    <p className="text-sm text-gray-500 mt-1">備註：{paper.notes}</p>
                                )}
                            </div>
                            <div className="flex space-x-2 ml-4">
                                <button
                                    onClick={() => setExpanded(!expanded)}
                                    className="text-blue-600 hover:text-blue-800 px-2 py-1"
                                >
                                    {expanded ? '▼' : '▶'}
                                </button>
                                <button
                                    onClick={onEdit}
                                    className="text-blue-600 hover:text-blue-800 px-2 py-1"
                                >
                                    ✏️
                                </button>
                                <button
                                    onClick={onDelete}
                                    className="text-red-600 hover:text-red-800 px-2 py-1"
                                >
                                    🗑️
                                </button>
                            </div>
                        </div>
                    </div>

                    {expanded && (
                        <div className="p-4">
                            <div className="flex justify-between items-center mb-3">
                                <h4 className="font-semibold text-gray-700">投稿歷程</h4>
                                <button
                                    onClick={onAddSubmission}
                                    className="bg-green-500 hover:bg-green-600 text-white px-3 py-1 rounded text-sm transition-colors"
                                >
                                    ➕ 新增投稿記錄
                                </button>
                            </div>

                            {paper.submissions.length === 0 ? (
                                <div className="text-center py-4 text-gray-500 bg-gray-50 rounded">
                                    尚未投稿，請新增投稿記錄
                                </div>
                            ) : (
                                <div className="space-y-3">
                                    {paper.submissions.map((submission, index) => (
                                        <SubmissionRecord
                                            key={submission.id}
                                            submission={submission}
                                            index={index + 1}
                                            getStatusColor={getStatusColor}
                                            onUpdate={(data) => onUpdateSubmission(submission.id, data)}
                                            onDelete={() => onDeleteSubmission(submission.id)}
                                        />
                                    ))}
                                </div>
                            )}
                        </div>
                    )}
                </div>
            );
        }

        // 投稿記錄組件
        function SubmissionRecord({ submission, index, getStatusColor, onUpdate, onDelete }) {
            const [isEditing, setIsEditing] = useState(false);
            const [editData, setEditData] = useState(submission);

            const handleSave = () => {
                onUpdate(editData);
                setIsEditing(false);
            };

            if (isEditing) {
                return (
                    <div className="border-l-4 border-blue-500 bg-blue-50 p-3 rounded">
                        <div className="space-y-2">
                            <input
                                type="text"
                                value={editData.journal}
                                onChange={(e) => setEditData({ ...editData, journal: e.target.value })}
                                placeholder="期刊名稱"
                                className="w-full px-3 py-2 border rounded"
                            />
                            <input
                                type="date"
                                value={editData.submissionDate}
                                onChange={(e) => setEditData({ ...editData, submissionDate: e.target.value })}
                                className="w-full px-3 py-2 border rounded"
                            />
                            <select
                                value={editData.status}
                                onChange={(e) => setEditData({ ...editData, status: e.target.value })}
                                className="w-full px-3 py-2 border rounded"
                            >
                                <option value="審查中">審查中</option>
                                <option value="已接受">已接受</option>
                                <option value="已拒絕">已拒絕</option>
                                <option value="修改後重審">修改後重審</option>
                                <option value="已撤回">已撤回</option>
                            </select>
                            <textarea
                                value={editData.notes || ''}
                                onChange={(e) => setEditData({ ...editData, notes: e.target.value })}
                                placeholder="備註"
                                className="w-full px-3 py-2 border rounded"
                                rows="2"
                            />
                            <div className="flex space-x-2">
                                <button
                                    onClick={handleSave}
                                    className="bg-green-500 hover:bg-green-600 text-white px-3 py-1 rounded text-sm"
                                >
                                    儲存
                                </button>
                                <button
                                    onClick={() => setIsEditing(false)}
                                    className="bg-gray-500 hover:bg-gray-600 text-white px-3 py-1 rounded text-sm"
                                >
                                    取消
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="border-l-4 border-indigo-500 bg-gray-50 p-3 rounded hover:bg-gray-100 transition-colors">
                    <div className="flex justify-between items-start">
                        <div className="flex-1">
                            <div className="flex items-center space-x-2 mb-1">
                                <span className="font-semibold text-gray-700">第 {index} 次投稿</span>
                                <span className={`px-2 py-1 rounded text-xs font-medium ${getStatusColor(submission.status)}`}>
                                    {submission.status}
                                </span>
                            </div>
                            <p className="text-sm text-gray-800">
                                <span className="font-medium">期刊：</span>{submission.journal}
                            </p>
                            <p className="text-sm text-gray-600">
                                <span className="font-medium">投稿日期：</span>
                                {new Date(submission.submissionDate).toLocaleDateString('zh-TW')}
                            </p>
                            {submission.notes && (
                                <p className="text-sm text-gray-500 mt-1">備註：{submission.notes}</p>
                            )}
                        </div>
                        <div className="flex space-x-2 ml-4">
                            <button
                                onClick={() => setIsEditing(true)}
                                className="text-blue-600 hover:text-blue-800 px-2 py-1"
                            >
                                ✏️
                            </button>
                            <button
                                onClick={onDelete}
                                className="text-red-600 hover:text-red-800 px-2 py-1"
                            >
                                🗑️
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        // 研討會管理分頁
        function ConferencesTab({ conferences, onAddConference, onEditConference, onDeleteConference }) {
            return (
                <div>
                    <div className="mb-4 flex justify-between items-center">
                        <h2 className="text-xl font-bold text-gray-800">研討會列表</h2>
                        <button
                            onClick={onAddConference}
                            className="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-medium transition-colors"
                        >
                            ➕ 新增研討會
                        </button>
                    </div>

                    {conferences.length === 0 ? (
                        <div className="bg-white rounded-lg shadow p-8 text-center text-gray-500">
                            尚無研討會記錄，請點擊上方按鈕新增
                        </div>
                    ) : (
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                            {conferences.map(conference => (
                                <ConferenceCard
                                    key={conference.id}
                                    conference={conference}
                                    onEdit={() => onEditConference(conference)}
                                    onDelete={() => onDeleteConference(conference.id)}
                                />
                            ))}
                        </div>
                    )}
                </div>
            );
        }

        // 研討會卡片組件
        function ConferenceCard({ conference, onEdit, onDelete }) {
            const getStatusColor = (status) => {
                const colors = {
                    '已提交': 'bg-green-100 text-green-800',
                    '準備中': 'bg-yellow-100 text-yellow-800',
                    '已接受': 'bg-blue-100 text-blue-800',
                    '已拒絕': 'bg-red-100 text-red-800',
                    '已參加': 'bg-purple-100 text-purple-800'
                };
                return colors[status] || 'bg-gray-100 text-gray-800';
            };

            return (
                <div className="bg-white rounded-lg shadow-md p-4 hover:shadow-lg transition-shadow">
                    <div className="flex justify-between items-start mb-3">
                        <h3 className="text-lg font-bold text-gray-800 flex-1">{conference.name}</h3>
                        <div className="flex space-x-2">
                            <button
                                onClick={onEdit}
                                className="text-blue-600 hover:text-blue-800"
                            >
                                ✏️
                            </button>
                            <button
                                onClick={onDelete}
                                className="text-red-600 hover:text-red-800"
                            >
                                🗑️
                            </button>
                        </div>
                    </div>

                    <div className="space-y-2 text-sm">
                        <div className="flex items-center text-gray-700">
                            <span className="font-medium mr-2">📅</span>
                            <span>{new Date(conference.date).toLocaleDateString('zh-TW')}</span>
                        </div>
                        <div className="flex items-center text-gray-700">
                            <span className="font-medium mr-2">📍</span>
                            <span>{conference.location}</span>
                        </div>
                        {conference.deadline && (
                            <div className="flex items-center text-gray-700">
                                <span className="font-medium mr-2">⏰</span>
                                <span>截止：{new Date(conference.deadline).toLocaleDateString('zh-TW')}</span>
                            </div>
                        )}
                        <div className="pt-2">
                            <span className={`px-3 py-1 rounded-full text-xs font-medium ${getStatusColor(conference.submissionStatus)}`}>
                                {conference.submissionStatus}
                            </span>
                        </div>
                        {conference.paperTitle && (
                            <div className="pt-2 border-t">
                                <p className="text-gray-600">
                                    <span className="font-medium">論文：</span>{conference.paperTitle}
                                </p>
                            </div>
                        )}
                        {conference.notes && (
                            <p className="text-gray-500 pt-2 border-t">備註：{conference.notes}</p>
                        )}
                    </div>
                </div>
            );
        }

        // 文章彈出視窗
        function PaperModal({ paper, onSave, onClose }) {
            const [formData, setFormData] = useState(
                paper || { title: '', authors: '', notes: '' }
            );

            const handleSubmit = (e) => {
                e.preventDefault();
                if (!formData.title.trim()) {
                    alert('請輸入文章標題');
                    return;
                }
                onSave(formData);
            };

            return (
                <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
                    <div className="bg-white rounded-lg shadow-xl max-w-md w-full">
                        <div className="p-6">
                            <h2 className="text-xl font-bold mb-4 text-gray-800">
                                {paper ? '編輯文章' : '新增文章'}
                            </h2>
                            <form onSubmit={handleSubmit} className="space-y-4">
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">
                                        文章標題 *
                                    </label>
                                    <input
                                        type="text"
                                        value={formData.title}
                                        onChange={(e) => setFormData({ ...formData, title: e.target.value })}
                                        className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                        required
                                    />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">
                                        作者
                                    </label>
                                    <input
                                        type="text"
                                        value={formData.authors}
                                        onChange={(e) => setFormData({ ...formData, authors: e.target.value })}
                                        className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                        placeholder="例如：張三, 李四, 王五"
                                    />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">
                                        備註
                                    </label>
                                    <textarea
                                        value={formData.notes}
                                        onChange={(e) => setFormData({ ...formData, notes: e.target.value })}
                                        className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                        rows="3"
                                    />
                                </div>
                                <div className="flex space-x-3 pt-4">
                                    <button
                                        type="submit"
                                        className="flex-1 bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-lg font-medium transition-colors"
                                    >
                                        儲存
                                    </button>
                                    <button
                                        type="button"
                                        onClick={onClose}
                                        className="flex-1 bg-gray-500 hover:bg-gray-600 text-white py-2 rounded-lg font-medium transition-colors"
                                    >
                                        取消
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            );
        }

        // 投稿記錄彈出視窗
        function SubmissionModal({ onSave, onClose }) {
            const [formData, setFormData] = useState({
                journal: '',
                submissionDate: new Date().toISOString().split('T')[0],
                status: '審查中',
                notes: ''
            });

            const handleSubmit = (e) => {
                e.preventDefault();
                if (!formData.journal.trim()) {
                    alert('請輸入期刊名稱');
                    return;
                }
                onSave(formData);
            };

            return (
                <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
                    <div className="bg-white rounded-lg shadow-xl max-w-md w-full">
                        <div className="p-6">
                            <h2 className="text-xl font-bold mb-4 text-gray-800">新增投稿記錄</h2>
                            <form onSubmit={handleSubmit} className="space-y-4">
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">
                                        期刊名稱 *
                                    </label>
                                    <input
                                        type="text"
                                        value={formData.journal}
                                        onChange={(e) => setFormData({ ...formData, journal: e.target.value })}
                                        className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                        required
                                    />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">
                                        投稿日期 *
                                    </label>
                                    <input
                                        type="date"
                                        value={formData.submissionDate}
                                        onChange={(e) => setFormData({ ...formData, submissionDate: e.target.value })}
                                        className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                        required
                                    />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">
                                        狀態 *
                                    </label>
                                    <select
                                        value={formData.status}
                                        onChange={(e) => setFormData({ ...formData, status: e.target.value })}
                                        className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                    >
                                        <option value="審查中">審查中</option>
                                        <option value="已接受">已接受</option>
                                        <option value="已拒絕">已拒絕</option>
                                        <option value="修改後重審">修改後重審</option>
                                        <option value="已撤回">已撤回</option>
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">
                                        備註
                                    </label>
                                    <textarea
                                        value={formData.notes}
                                        onChange={(e) => setFormData({ ...formData, notes: e.target.value })}
                                        className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                        rows="3"
                                    />
                                </div>
                                <div className="flex space-x-3 pt-4">
                                    <button
                                        type="submit"
                                        className="flex-1 bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-lg font-medium transition-colors"
                                    >
                                        儲存
                                    </button>
                                    <button
                                        type="button"
                                        onClick={onClose}
                                        className="flex-1 bg-gray-500 hover:bg-gray-600 text-white py-2 rounded-lg font-medium transition-colors"
                                    >
                                        取消
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            );
        }

        // 研討會彈出視窗
        function ConferenceModal({ conference, onSave, onClose }) {
            const [formData, setFormData] = useState(
                conference || {
                    name: '',
                    date: '',
                    location: '',
                    deadline: '',
                    submissionStatus: '準備中',
                    paperTitle: '',
                    notes: ''
                }
            );

            const handleSubmit = (e) => {
                e.preventDefault();
                if (!formData.name.trim() || !formData.date || !formData.location.trim()) {
                    alert('請填寫必填欄位');
                    return;
                }
                onSave(formData);
            };

            return (
                <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
                    <div className="bg-white rounded-lg shadow-xl max-w-md w-full max-h-[90vh] overflow-y-auto">
                        <div className="p-6">
                            <h2 className="text-xl font-bold mb-4 text-gray-800">
                                {conference ? '編輯研討會' : '新增研討會'}
                            </h2>
                            <form onSubmit={handleSubmit} className="space-y-4">
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">
                                        研討會名稱 *
                                    </label>
                                    <input
                                        type="text"
                                        value={formData.name}
                                        onChange={(e) => setFormData({ ...formData, name: e.target.value })}
                                        className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                        required
                                    />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">
                                        日期 *
                                    </label>
                                    <input
                                        type="date"
                                        value={formData.date}
                                        onChange={(e) => setFormData({ ...formData, date: e.target.value })}
                                        className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                        required
                                    />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">
                                        地點 *
                                    </label>
                                    <input
                                        type="text"
                                        value={formData.location}
                                        onChange={(e) => setFormData({ ...formData, location: e.target.value })}
                                        className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                        required
                                    />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">
                                        截止日期
                                    </label>
                                    <input
                                        type="date"
                                        value={formData.deadline}
                                        onChange={(e) => setFormData({ ...formData, deadline: e.target.value })}
                                        className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                    />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">
                                        提交狀態 *
                                    </label>
                                    <select
                                        value={formData.submissionStatus}
                                        onChange={(e) => setFormData({ ...formData, submissionStatus: e.target.value })}
                                        className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                    >
                                        <option value="準備中">準備中</option>
                                        <option value="已提交">已提交</option>
                                        <option value="已接受">已接受</option>
                                        <option value="已拒絕">已拒絕</option>
                                        <option value="已參加">已參加</option>
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">
                                        論文標題
                                    </label>
                                    <input
                                        type="text"
                                        value={formData.paperTitle}
                                        onChange={(e) => setFormData({ ...formData, paperTitle: e.target.value })}
                                        className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                    />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">
                                        備註
                                    </label>
                                    <textarea
                                        value={formData.notes}
                                        onChange={(e) => setFormData({ ...formData, notes: e.target.value })}
                                        className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                        rows="3"
                                    />
                                </div>
                                <div className="flex space-x-3 pt-4">
                                    <button
                                        type="submit"
                                        className="flex-1 bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-lg font-medium transition-colors"
                                    >
                                        儲存
                                    </button>
                                    <button
                                        type="button"
                                        onClick={onClose}
                                        className="flex-1 bg-gray-500 hover:bg-gray-600 text-white py-2 rounded-lg font-medium transition-colors"
                                    >
                                        取消
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            );
        }

        // 首次設定頁面
        function FirstTimeSetup({ onSetup }) {
            const [username, setUsername] = useState('');
            const [password, setPassword] = useState('');
            const [confirmPassword, setConfirmPassword] = useState('');
            const [error, setError] = useState('');

            const handleSubmit = (e) => {
                e.preventDefault();
                setError('');

                if (!username.trim() || username.length < 3) {
                    setError('帳號至少需要3個字元');
                    return;
                }

                if (password.length < 6) {
                    setError('密碼至少需要6個字元');
                    return;
                }

                if (password !== confirmPassword) {
                    setError('兩次輸入的密碼不一致');
                    return;
                }

                onSetup(username, password);
            };

            return (
                <div className="min-h-screen bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center p-4">
                    <div className="bg-white rounded-2xl shadow-2xl p-8 max-w-md w-full">
                        <div className="text-center mb-8">
                            <div className="text-5xl mb-4">🎓</div>
                            <h1 className="text-3xl font-bold text-gray-800 mb-2">歡迎使用</h1>
                            <h2 className="text-xl text-gray-600">學術投稿管理系統</h2>
                            <p className="text-sm text-gray-500 mt-4">首次使用，請設定您的帳號密碼</p>
                        </div>

                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-2">
                                    帳號 *
                                </label>
                                <input
                                    type="text"
                                    value={username}
                                    onChange={(e) => setUsername(e.target.value)}
                                    className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                    placeholder="請輸入帳號（至少3個字元）"
                                    required
                                />
                            </div>

                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-2">
                                    密碼 *
                                </label>
                                <input
                                    type="password"
                                    value={password}
                                    onChange={(e) => setPassword(e.target.value)}
                                    className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                    placeholder="請輸入密碼（至少6個字元）"
                                    required
                                />
                            </div>

                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-2">
                                    確認密碼 *
                                </label>
                                <input
                                    type="password"
                                    value={confirmPassword}
                                    onChange={(e) => setConfirmPassword(e.target.value)}
                                    className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                    placeholder="請再次輸入密碼"
                                    required
                                />
                            </div>

                            {error && (
                                <div className="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg text-sm">
                                    ⚠️ {error}
                                </div>
                            )}

                            <button
                                type="submit"
                                className="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-lg font-medium transition-colors text-lg"
                            >
                                完成設定
                            </button>
                        </form>

                        <div className="mt-6 p-4 bg-yellow-50 border border-yellow-200 rounded-lg">
                            <p className="text-xs text-yellow-800">
                                ⚠️ 重要提醒：請妥善保管您的帳號密碼。如果忘記密碼，需要清除瀏覽器的localStorage才能重新設定。
                            </p>
                        </div>
                    </div>
                </div>
            );
        }

        // 登入頁面
        function LoginPage({ onLogin }) {
            const [username, setUsername] = useState('');
            const [password, setPassword] = useState('');
            const [error, setError] = useState('');
            const [showResetInfo, setShowResetInfo] = useState(false);

            const handleSubmit = (e) => {
                e.preventDefault();
                setError('');

                const success = onLogin(username, password);
                if (!success) {
                    setError('帳號或密碼錯誤');
                }
            };

            const handleReset = () => {
                if (confirm('確定要重設系統嗎？這將會清除所有資料，包括帳號密碼！')) {
                    if (confirm('再次確認：真的要清除所有資料嗎？此操作無法復原！')) {
                        localStorage.clear();
                        sessionStorage.clear();
                        window.location.reload();
                    }
                }
            };

            return (
                <div className="min-h-screen bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center p-4">
                    <div className="bg-white rounded-2xl shadow-2xl p-8 max-w-md w-full">
                        <div className="text-center mb-8">
                            <div className="text-5xl mb-4">🎓</div>
                            <h1 className="text-3xl font-bold text-gray-800 mb-2">學術投稿管理系統</h1>
                            <p className="text-gray-600">請登入以繼續使用</p>
                        </div>

                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-2">
                                    帳號
                                </label>
                                <input
                                    type="text"
                                    value={username}
                                    onChange={(e) => setUsername(e.target.value)}
                                    className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                    placeholder="請輸入帳號"
                                    required
                                    autoFocus
                                />
                            </div>

                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-2">
                                    密碼
                                </label>
                                <input
                                    type="password"
                                    value={password}
                                    onChange={(e) => setPassword(e.target.value)}
                                    className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                    placeholder="請輸入密碼"
                                    required
                                />
                            </div>

                            {error && (
                                <div className="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg text-sm">
                                    ⚠️ {error}
                                </div>
                            )}

                            <button
                                type="submit"
                                className="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-lg font-medium transition-colors text-lg"
                            >
                                登入
                            </button>
                        </form>

                        <div className="mt-6 text-center">
                            <button
                                onClick={() => setShowResetInfo(!showResetInfo)}
                                className="text-sm text-blue-600 hover:text-blue-800 underline"
                            >
                                忘記密碼？
                            </button>
                        </div>

                        {showResetInfo && (
                            <div className="mt-4 p-4 bg-yellow-50 border border-yellow-200 rounded-lg">
                                <p className="text-sm text-yellow-800 mb-3">
                                    如果您忘記密碼，可以點擊下方按鈕重設系統。<br/>
                                    <strong className="text-red-600">警告：這會清除所有資料！</strong>
                                </p>
                                <button
                                    onClick={handleReset}
                                    className="w-full bg-red-500 hover:bg-red-600 text-white py-2 rounded-lg text-sm font-medium transition-colors"
                                >
                                    🔄 重設系統（清除所有資料）
                                </button>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        // 渲染應用
        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
